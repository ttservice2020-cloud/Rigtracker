<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RigTracker Pro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#05080d;--panel:#101824;--panel2:#142238;--blue:#2f8ff0;--blue-light:#70b7ff;--white:#f3f7fc;--muted:#a9bdd3;--line:#2b4059;--silver1:#1a2a3d;--silver2:#243a53;--blue-border:#2f8ff0}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.brandbar{height:76px;border-bottom:2px solid var(--blue);display:flex;align-items:center;justify-content:space-between;padding:8px 3%;gap:14px}
.brand{display:flex;align-items:center;gap:12px;font-size:clamp(20px,3vw,34px);font-weight:800}
.truck{width:92px;height:60px;flex:none}
.brand span{white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:12px;color:var(--muted)}
.top-actions button,.outline{color:var(--white);background:transparent;border:2px solid var(--blue);border-radius:10px;padding:9px 15px;font-weight:700}
main{max-width:1440px;margin:0 auto;padding:24px 3% 48px}
h1{font-size:clamp(30px,4vw,48px);margin:10px 0 16px}
h2{font-size:clamp(22px,3vw,32px);margin:0 0 8px}
h3{margin:0 0 10px}
p{line-height:1.45}
.blue{color:var(--blue)}
.muted{color:var(--muted)}
.primary-btn{background:linear-gradient(#43a2ff,#176bc1);border:0;border-radius:12px;color:#fff;font-size:18px;font-weight:800;padding:14px 22px}
.primary-btn:hover{filter:brightness(1.07)}
.secondary-btn{background:#191919;color:var(--white);border:2px solid #777;border-radius:10px;font-weight:700;padding:10px 16px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:12px 0 24px}
.back{color:var(--white);background:none;border:0;font-size:16px;padding:8px 0;text-align:left}
.year-select{background:#1c1c1c;color:#fff;border:2px solid #fff;border-radius:11px;padding:10px 16px;font-weight:700;min-width:145px}
.card{background:linear-gradient(145deg,#181818,#0d0d0d);border:1px solid #383838;border-radius:16px;padding:22px}
.grid{display:grid;gap:18px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:24px 0}
.stat{border:1.5px solid #eee;padding:18px 22px;min-height:104px}
.stat-label{font-size:17px;font-weight:700}
.stat-value{font-size:32px;font-weight:800;margin-top:8px}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:linear-gradient(125deg,#eee,#bababa 38%,#f5f5f5 56%,#aaa);color:#111;border-radius:16px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:126px}
.tile h3{font-size:24px;margin:0 0 6px}
.tile p{font-size:18px;margin:0;max-width:420px}
.tile .primary-btn{min-width:190px}
.panel{background:#101010;border:2px solid #555;border-radius:16px;padding:22px;margin:16px 0}
.panel.blue-edge{border-color:var(--blue)}
.panel.red-edge{border-color:var(--blue-border)}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
#settlementPage .form-grid{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:22px}
#settlementPage .form-grid .field{min-width:0}
#settlementPage .form-grid input{display:block;width:100%;min-width:0;max-width:280px}
@media(max-width:850px){#settlementPage .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){#settlementPage .form-grid{grid-template-columns:minmax(0,1fr)}}
.field label{display:block;font-weight:700;margin:0 0 7px;font-size:17px}
.field input,.field select,.field textarea,.deduction-name{width:100%;border:1px solid #999;border-radius:9px;background:#f7f7f7;color:#111;padding:12px 14px;min-height:48px}
.field textarea{min-height:62px;resize:vertical}
.deduction-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin-top:16px}
.deduction-row{display:grid;grid-template-columns:minmax(100px,1fr) 48px minmax(120px,1fr);gap:9px;align-items:center;border:1px solid #bdbdbd;border-radius:11px;background:linear-gradient(120deg,#eee,#bdbdbd,#f2f2f2);padding:8px 10px;color:#111}
.deduction-row:nth-child(even){background:linear-gradient(120deg,#d8d8d8,#aaa,#e5e5e5)}
.deduction-row strong{font-size:16px}
.deduction-row input{background:#fff;border:1px solid #333;border-radius:8px;color:#111;padding:9px;width:100%;font-weight:700}
.plus{background:#111;color:var(--blue);border:3px solid var(--blue);border-radius:8px;font-size:24px;font-weight:800;width:42px;height:42px;line-height:30px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--blue);border-radius:14px;padding:16px;margin:22px 0}
.total{text-align:center;border-right:1px solid #aaa}
.total:last-child{border:0}
.total strong{display:block;font-size:17px}
.total span{display:block;font-size:32px;font-weight:800;margin-top:5px}
.full{width:100%}
.table-shell{overflow:auto;border:1px solid #666;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:11px 13px;border:1px solid #555;text-align:left;white-space:nowrap}
th{background:linear-gradient(#eee,#bbb);color:#111}
tbody tr:nth-child(even){background:#161616}
tbody tr:nth-child(odd){background:#0b0b0b}
.amount-box{display:inline-block;border:1px solid #aaa;border-radius:6px;padding:3px 10px;min-width:100px;text-align:right}
.table-footer{font-weight:800;background:#111}
.table-help{text-align:center;margin:10px;color:var(--muted)}
.actions-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:20px}
.page{display:none}
.page.active{display:block}
.login-wrap{max-width:700px;margin:24px auto 60px}
.login-hero{text-align:center;margin:14px auto 28px}
.hero-truck{width:min(300px,60vw);height:auto}
.login-hero h1{font-size:clamp(42px,7vw,72px);margin:4px 0}
.login-hero p{font-size:clamp(18px,2.6vw,28px);margin:8px}
.login-card{background:linear-gradient(145deg,#202020,#101010);border-radius:28px;padding:clamp(24px,5vw,56px);box-shadow:0 10px 45px #111}
.login-card h2{text-align:center;font-size:clamp(34px,5vw,54px);margin-bottom:30px}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #777;border-radius:15px;overflow:hidden;margin-bottom:28px}
.role-tab{background:transparent;color:#fff;border:0;border-right:1px solid #777;padding:16px 8px;font-size:20px;font-weight:800}
.role-tab:last-child{border:0}
.role-tab.active{background:linear-gradient(#43a2ff,#176bc1);color:#fff}
.login-field{margin:18px 0}
.login-field label{display:block;font-size:18px;font-weight:700;margin-bottom:8px}
.login-field input{width:100%;min-height:58px;background:#252525;color:white;border:1px solid #999;border-radius:12px;padding:14px;font-size:18px}
.login-actions{margin-top:38px}
.link-row{text-align:right;margin:10px 0 20px}
.link-btn{background:none;border:0;color:#70b7ff;text-decoration:underline;font-size:16px}
.login-bottom{text-align:center;border-top:1px solid #777;margin-top:22px;padding-top:20px;font-size:17px}
.inline-link{color:#70b7ff;background:none;border:0;text-decoration:underline;font-size:inherit}
.tag{background:#444;color:#ddd;border-radius:22px;padding:7px 14px;font-size:14px}
.summary-row{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.expense-table{width:100%;min-width:0}
.expense-table th:first-child,.expense-table td:first-child{width:75%}
.tax-stats{grid-template-columns:repeat(3,1fr);margin:0 0 14px}
.tax-stats .stat{border:2px solid var(--blue-border)}
.tax-callout{background:#151515;border:2px solid var(--blue-border);border-radius:14px;padding:18px}
.tax-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
.tax-actions button{background:#111;border:2px solid var(--blue-border);color:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:800}
.tax-docs{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px}
.time-zone{min-width:220px}
.perdiem-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.perdiem-form .wide{grid-column:1/-1}
.sleeper-grid{display:grid;grid-template-columns:1fr 1fr 160px;gap:12px;align-items:end}
.support-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#252525;border:1px solid var(--blue);padding:14px 20px;border-radius:10px;z-index:100;max-width:90vw;box-shadow:0 5px 25px #000}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:90}
#modal.open{display:flex}
.modal-card{max-width:520px;width:100%;background:#171717;border:2px solid var(--blue);border-radius:16px;padding:24px}
.modal-card button{margin-top:12px}
footer{text-align:center;color:#aaa;border-top:1px solid #777;padding:18px;margin-top:28px}
@media(max-width:850px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .form-grid{grid-template-columns:1fr 1fr}
 .summary-row{grid-template-columns:1fr}
 .tile{padding:18px;min-height:120px}
 .tile .primary-btn{min-width:140px;padding:12px}
}
@media(max-width:600px){
 main{padding:16px 4% 36px}
 .brandbar{height:auto;min-height:66px;padding:8px 4%}
 .truck{width:56px;height:34px}
 .top-actions{gap:6px}
 .top-actions span{display:none}
 .stats{gap:10px}
 .stat{padding:13px;min-height:92px}
 .stat-label{font-size:13px}
 .stat-value{font-size:23px}
 .tiles{grid-template-columns:1fr;gap:12px}
 .tile{padding:16px;min-height:115px}
 .tile h3{font-size:19px}
 .tile p{font-size:15px}
 .tile .primary-btn{min-width:110px;max-width:138px;font-size:14px;padding:11px 8px}
 .form-grid,.deduction-grid,.tax-stats,.tax-actions,.tax-docs,.perdiem-form{grid-template-columns:1fr}
 .perdiem-form .wide{grid-column:auto}
 .deduction-row{grid-template-columns:minmax(80px,1fr) 40px minmax(90px,1fr);padding:6px}
 .deduction-row strong{font-size:14px}
 .deduction-row input{padding:8px 5px}
 .plus{width:36px;height:36px;font-size:20px}
 .totals{padding:10px 4px}
 .total strong{font-size:13px}
 .total span{font-size:22px}
 .sleeper-grid{grid-template-columns:1fr 1fr}
 .sleeper-grid .primary-btn,.sleeper-grid .secondary-btn{grid-column:1/-1}
 .panel{padding:16px}
 .login-card{padding:22px 18px}
 .role-tab{font-size:16px;padding:13px 4px}
 .login-card h2{font-size:36px}
 .login-field label{font-size:16px}
 .login-field input{min-height:52px}
}
.settlement-actions{display:flex;gap:8px}
.settlement-actions .outline{padding:7px 10px}
.settlement-actions .delete{border-color:var(--blue-border)}
@media print{
 body{background:#fff;color:#000}
 .brandbar,.no-print,button,.top-actions{display:none!important}
 main{max-width:none;padding:0}
 .page{display:none!important}
 .page.active{display:block!important}
 .panel,.card,.stat,.tax-callout{background:#fff;color:#000;border-color:#777}
 table,th,td{color:#000}
 footer{color:#444}
}
/* Fleet workspace and dispatch styling. */
.fleet-launch{background:linear-gradient(130deg,#101c29,#09111a)!important;color:#eef5fc!important;border:1px solid #25415f}.fleet-launch p{color:#b2c4d7}.fleet-launch .primary-btn{background:#2685e8;color:white}

r:#91a0b3}.fleet-stat strong{display:block;font-size:16px}.fleet-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:7px}.fleet-panel h3{font-size:10px;margin:0 0 7px}.fleet-panel p{font-size:9px;color:#91a0b3}.fleet-table-wrap{overflow:auto}#fleetApp table{width:100%;border-collapse:collapse;min-width:400px}#fleetApp th,#fleetApp td{border-bottom:1px solid #223144;padding:6px 4px;text-align:left;font-size:8px;white-space:nowrap}#fleetApp th{color:#91a0b3;text-transform:uppercase;font-size:7px}#fleetApp td{color:#dce7f1}.fleet-pro{color:#78bdff!important;font-weight:800}.fleet-status{border-radius:99px;padding:3px 5px;font-size:7px;background:#17334d;color:#80c7ff}.fleet-status.ok{background:#16382f;color:#72dcb1}.fleet-status.warn{background:#102c49;color:#80c7ff}.fleet-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #223144;font-size:9px}.fleet-muted,.fleet-note{color:#91a0b3;font-size:8px}.fleet-alert{background:#10263a;border:1px solid #1e4c70;border-radius:7px;padding:7px;color:#b8dfff;font-size:8px;margin-bottom:8px}
@media(max-width:780px){#fleetApp{grid-template-columns:150px minmax(0,1fr)}.fleet-stats{grid-template-columns:repeat(2,1fr)}.fleet-grid{grid-template-columns:1fr}}@media(max-width:560px){#fleetApp{grid-template-columns:1fr}.fleet-side{border:0;border-bottom:1px solid #223144;padding:7px}.fleet-nav{grid-template-columns:repeat(3,1fr)}.fleet-nav button{text-align:center;padding:5px 1px;font-size:8px}.fleet-demo-note{display:none}.fleet-main{padding:0 7px 10px}.fleet-head{display:block}.fleet-head .fleet-btn{margin-top:5px}}
.fleet-mode-bar{display:flex;gap:7px;align-items:center;margin:0 0 8px;padding:0 0 8px;border-bottom:1px solid #253347}.fleet-mode-bar button{background:#101824;color:#b8c5d3;border:1px solid #2a394b;border-radius:7px;padding:7px 14px;font:700 12px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}.fleet-mode-bar button.active{background:#17334d;border-color:#2685e8;color:#fff}.fleet-mode-bar button[hidden]{display:none!important}@media(max-width:560px){.fleet-mode-bar{padding-bottom:6px}.fleet-mode-bar button{flex:1}}
.fleet-mode-bar{display:grid;grid-template-columns:1fr;margin:0 0 2px;padding:0;border:0}.fleet-mode-bar button{text-align:left;padding:8px 7px}.fleet-mode-bar button[data-fmode="dispatch"]{background:#102238;border-color:#2f8ff0;color:#d9edff;font-size:12px}.fleet-mode-bar button[data-fmode="dispatch"].active{background:#176bc1;color:#fff}

9px}.fleet-create .fc-result strong{color:#f0f6fc}.fleet-create .fc-driver-rate{padding:9px;border:1px solid #34465b;border-radius:6px;text-align:center;background:#0c1725}.fleet-create .fc-driver-rate b{display:block;font-size:10px}.fleet-create .fc-driver-rate strong{display:block;margin:9px 0;font-size:18px;color:#f3f7fb}.fleet-create .fc-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.fleet-create .fc-split{grid-template-columns:1.4fr .9fr .9fr .9fr}

/* Unified blue and black palette across sign-in, driver, fleet, and tax pages. */
.brandbar{border-bottom-color:#2f8ff0}
.primary-btn{background:linear-gradient(180deg,#43a2ff,#176bc1);color:#fff;box-shadow:0 4px 14px #0b3154}
.primary-btn:hover{background:linear-gradient(180deg,#69b6ff,#247bd2)}
.role-tabs{border-color:#2b4059}.role-tab{border-right-color:#2b4059}.role-tab.active{background:linear-gradient(180deg,#43a2ff,#176bc1);color:#fff}
.login-card{background:linear-gradient(145deg,#142238,#080d15);border:1px solid #263e5b;box-shadow:0 10px 45px #000}
.login-field input{background:#0b1420;border-color:#344d6a;color:#f3f7fc}
.link-btn,.inline-link{color:#70b7ff}
.tile{background:linear-gradient(135deg,#142238,#0b111b);color:#f3f7fc;border:1px solid #263e5b}
.tile p{color:#b5c7db}
.panel,.card,.stat,.tax-callout{background:linear-gradient(145deg,#111c2b,#0a111b);color:#f3f7fc;border-color:#2b4059}
.panel.blue-edge,.panel.red-edge{border-color:#2f8ff0}
.field input,.field select,.field textarea,.deduction-name{background:#0b1420;color:#f3f7fc;border-color:#344d6a}
.deduction-row,.deduction-row:nth-child(even){background:linear-gradient(120deg,#15263a,#0e1927,#1a2d43);border-color:#2b4059;color:#f3f7fc}
.deduction-row input{background:#0b1420;border-color:#344d6a;color:#f3f7fc}
.plus{background:#102238;color:#70b7ff;border-color:#2f8ff0}
.totals{border-color:#2f8ff0}.total{border-right-color:#2b4059}
