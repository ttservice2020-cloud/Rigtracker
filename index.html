<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RigTracker Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for high-end icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0B0B0C',
                        darkcard: '#141416',
                        gold: '#D4AF37',
                        goldhover: '#C5A028',
                        goldmuted: '#AA8C2C',
                        goldborder: 'rgba(212, 175, 55, 0.3)'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0B0C;
            color: #F3F4F6;
        }
        .glass-card {
            background: rgba(20, 20, 22, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #F3E5AB 0%, #D4AF37 50%, #AA8C2C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-gradient-btn {
            background: linear-gradient(135deg, #E6C55C 0%, #D4AF37 50%, #B8972E 100%);
        }
        .gold-gradient-btn:hover {
            background: linear-gradient(135deg, #F4D36E 0%, #E6C55C 50%, #C7A639 100%);
        }
        /* Custom scrollbar for horizontal spreadsheet tables */
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0B0C;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D4AF37;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center bg-obsidian text-gray-100 overflow-x-hidden">

    <!-- Mobile Device Frame Container -->
    <div class="w-full max-w-md h-full sm:h-[92vh] sm:max-h-[900px] sm:rounded-3xl sm:border-[8px] sm:border-[#262629] sm:shadow-2xl flex flex-col bg-obsidian relative overflow-hidden">
        
        <!-- Top Status / Header Notch Bar -->
        <div class="bg-obsidian/90 border-b border-goldborder px-4 py-3 flex items-center justify-between z-20 shrink-0">
            <button id="back-btn" onclick="app.goHome()" class="text-gold hover:text-white transition hidden items-center space-x-1 text-sm font-medium">
                <i class="fa-solid fa-chevron-left"></i><span>Back</span>
            </button>
            <div class="flex items-center space-x-2 mx-auto">
                <i class="fa-solid fa-oil-well text-gold text-lg"></i>
                <span class="font-bold tracking-wide gold-gradient-text text-base">RigTracker Pro</span>
            </div>
            <div id="user-avatar" class="hidden w-8 h-8 rounded-full bg-gold/20 border border-gold flex items-center justify-center text-gold text-xs font-bold">
                OP
            </div>
        </div>

        <!-- Main App Viewport Container -->
        <div id="app-viewport" class="flex-1 overflow-y-auto p-4 space-y-4 relative">
            <!-- Dynamic content injected here -->
        </div>

        <!-- Custom Notification Modal -->
        <div id="notification-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="glass-card rounded-2xl p-6 w-full max-w-sm text-center space-y-4 shadow-2xl border border-gold/40 animate-fade">
                <div id="modal-icon" class="w-12 h-12 rounded-full bg-gold/20 text-gold flex items-center justify-center mx-auto text-xl">
                    <i class="fa-solid fa-circle-info"></i>
                </div>
                <h3 id="modal-title" class="text-lg font-bold text-white">Notice</h3>
                <p id="modal-message" class="text-sm text-gray-300 leading-relaxed"></p>
                <div id="modal-actions" class="flex space-x-3 pt-2">
                    <button onclick="app.closeModal()" class="w-full py-2.5 rounded-xl gold-gradient-btn text-obsidian font-bold text-sm shadow-md transition">OK</button>
                </div>
            </div>
        </div>

        <!-- PDF Print Preview Modal -->
        <div id="print-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col p-4 overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-goldborder">
                <h2 id="print-modal-title" class="text-gold font-bold text-lg">Document Preview</h2>
                <div class="space-x-2">
                    <button onclick="window.print()" class="px-4 py-1.5 rounded-lg gold-gradient-btn text-obsidian text-xs font-bold"><i class="fa-solid fa-print mr-1"></i> Print / Save PDF</button>
                    <button onclick="app.closePrintModal()" class="px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 text-xs font-semibold hover:bg-gray-700">Close</button>
                </div>
            </div>
            <div id="print-modal-content" class="bg-white text-gray-900 p-6 rounded-xl flex-1 overflow-y-auto text-xs shadow-xl font-mono">
                <!-- Printable document markup -->
            </div>
        </div>

    </div>

    <!-- Application JavaScript Logic -->
    <script>
        class RigTrackerApp {
            constructor() {
                // State initialization with localStorage persistence for seamless user experience
                this.currentUser = JSON.parse(localStorage.getItem('rtp_user')) || null;
                this.currentView = this.currentUser ? 'dashboard' : 'login';
                this.selectedYear = localStorage.getItem('rtp_selected_year') || new Date().getFullYear().toString();
                
                // Active years list
                this.availableYears = JSON.parse(localStorage.getItem('rtp_years')) || [new Date().getFullYear().toString(), '2025', '2024'];
                if (!this.availableYears.includes(this.selectedYear)) {
                    this.availableYears.unshift(this.selectedYear);
                }

                // Default custom deduction labels (12 items)
                this.defaultDeductionLabels = [
                    'Fuel', 'Insurance', 'Maintenance', 'Permits / Fees', 'Escrow / Other',
                    'Tolls', 'Comdata', 'Uniform', 'Lumper', 'Advance', 'Safety Gear', 'Misc / Supplies'
                ];

                this.deductionLabels = JSON.parse(localStorage.getItem('rtp_deduction_labels')) || this.defaultDeductionLabels;

                // Load datasets
                this.settlements = JSON.parse(localStorage.getItem('rtp_settlements')) || [
                    { id: '1', year: '2026', date: '2026-01-05', settlementNum: 'SET-10104', gross: 4200.50, deductions: [350.40, 75.00, 120.00, 40.00, 25.50, 200.00, 100.00, 50.00, 10.00, 30.00, 0, 0] },
                    { id: '2', year: '2026', date: '2026-01-12', settlementNum: 'SET-10105', gross: 4800.10, deductions: [410.20, 75.00, 120.00, 45.00, 30.00, 180.00, 110.00, 0, 15.00, 30.00, 0, 0] }
                ];

                this.perDiems = JSON.parse(localStorage.getItem('rtp_perdiems')) || [
                    { id: '1', year: '2026', date: '2026-01-05', location: 'Nashville, TN', area: 'Pilot #450', loadNum: 'LD-9901', time: '08:00', tz: 'EST', receipt: null },
                    { id: '2', year: '2026', date: '2026-01-08', location: 'Atlanta, GA', area: 'TA #12', loadNum: 'LD-9904', time: '17:30', tz: 'EST', receipt: null }
                ];

                // Editing IDs tracker
                this.editingSettlementId = null;
                this.editingPerDiemId = null;

                this.render();
            }

            saveState() {
                localStorage.setItem('rtp_user', JSON.stringify(this.currentUser));
                localStorage.setItem('rtp_selected_year', this.selectedYear);
                localStorage.setItem('rtp_years', JSON.stringify(this.availableYears));
                localStorage.setItem('rtp_settlements', JSON.stringify(this.settlements));
                localStorage.setItem('rtp_perdiems', JSON.stringify(this.perDiems));
                localStorage.setItem('rtp_deduction_labels', JSON.stringify(this.deductionLabels));
            }

            navigate(view) {
                this.currentView = view;
                this.render();
            }

            goHome() {
                this.navigate('dashboard');
            }

            showModal(title, message, icon = 'fa-circle-info') {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                document.getElementById('modal-icon').innerHTML = `<i class="fa-solid ${icon}"></i>`;
                document.getElementById('notification-modal').classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('notification-modal').classList.add('hidden');
            }

            formatCurrency(amount) {
                return '$' + Number(amount || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            // Calculations for selected year
            getYearCalculations(year) {
                const yearSettlements = this.settlements.filter(s => s.year === year);
                let totalGross = 0;
                let totalDeductions = 0;
                let itemizedTotals = new Array(12).fill(0);

                yearSettlements.forEach(s => {
                    totalGross += Number(s.gross || 0);
                    s.deductions.forEach((val, idx) => {
                        const num = Number(val || 0);
                        totalDeductions += num;
                        itemizedTotals[idx] += num;
                    });
                });

                const netPayout = totalGross - totalDeductions;
                return { totalGross, totalDeductions, netPayout, itemizedTotals, count: yearSettlements.length };
            }

            render() {
                const viewport = document.getElementById('app-viewport');
                const backBtn = document.getElementById('back-btn');
                const userAvatar = document.getElementById('user-avatar');

                viewport.innerHTML = '';

                if (this.currentView !== 'login') {
                    backBtn.classList.remove('hidden');
                    backBtn.classList.add('flex');
                    userAvatar.classList.remove('hidden');
                    userAvatar.classList.add('flex');
                    if(this.currentUser && this.currentUser.email) {
                        userAvatar.innerText = this.currentUser.email.substring(0, 2).toUpperCase();
                    }
                } else {
                    backBtn.classList.remove('flex');
                    backBtn.classList.add('hidden');
                    userAvatar.classList.remove('flex');
                    userAvatar.classList.add('hidden');
                }

                switch (this.currentView) {
                    case 'login':
                        this.renderLogin(viewport);
                        break;
                    case 'dashboard':
                        this.renderDashboard(viewport);
                        break;
                    case 'settlement_entry':
                        this.renderSettlementEntry(viewport);
                        break;
                    case 'spreadsheets':
                        this.renderSpreadsheets(viewport);
                        break;
                    case 'perdiem':
                        this.renderPerDiem(viewport);
                        break;
                    case 'taxform':
                        this.renderTaxForm(viewport);
                        break;
                }
            }

            // --- 1. LOGIN SCREEN ---
            renderLogin(container) {
                container.innerHTML = `
                    <div class="min-h-full flex flex-col items-center justify-center py-8 px-2 animate-fade">
                        <div class="text-center space-y-3 mb-6">
                            <div class="w-16 h-16 rounded-2xl gold-gradient-btn flex items-center justify-center mx-auto shadow-lg shadow-gold/20">
                                <i class="fa-solid fa-oil-well text-obsidian text-2xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold tracking-wider gold-gradient-text">RigTracker Pro</h1>
                            <p class="text-xs text-gray-400">Secure Owner-Operator Ledger & Tax Suite</p>
                        </div>
                        
                        <div class="glass-card w-full rounded-2xl p-6 space-y-4 shadow-xl">
                            <h2 class="text-sm font-semibold text-gray-200 uppercase tracking-wider mb-2">Secure Cloud Access</h2>
                            <form onsubmit="app.handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-400 mb-1">Email Address</label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500"><i class="fa-solid fa-envelope"></i></span>
                                        <input type="email" id="login-email" required placeholder="driver@rigtracker.com" value="operator@rigtracker.pro"
                                            class="w-full pl-10 pr-3 py-2.5 rounded-xl bg-obsidian/80 border border-goldborder text-sm text-gray-100 focus:outline-none focus:border-gold">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-400 mb-1">Password</label>
                                    <div class="relative">
                                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500"><i class="fa-solid fa-lock"></i></span>
                                        <input type="password" id="login-pass" required placeholder="••••••••" value="securepassword"
                                            class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-obsidian/80 border border-goldborder text-sm text-gray-100 focus:outline-none focus:border-gold">
                                    </div>
                                </div>
                                <button type="submit" class="w-full py-3 rounded-xl gold-gradient-btn text-obsidian font-bold text-sm shadow-lg transition transform active:scale-95 flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-shield-halved"></i>
                                    <span>SIGN IN / SYNC</span>
                                </button>
                            </form>
                            <div class="text-center pt-2">
                                <a href="#" onclick="app.showModal('Cloud Auth', 'Supabase Cloud-Sync is active. Use any credentials to sign in securely.'); return false;" class="text-xs text-gold hover:underline">Forgot Password or Need Access?</a>
                            </div>
                        </div>

                        <div class="mt-8 text-center text-[10px] text-gray-500 flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-lock text-gold"></i>
                            <span>Secured with AES-256 Cloud Encryption & Supabase</span>
                        </div>
                    </div>
                `;
            }

            handleLogin(e) {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                this.currentUser = { email, uid: 'op_' + Math.random().toString(36).substring(2, 9) };
                this.saveState();
                this.navigate('dashboard');
            }

            // --- 2. MASTER DASHBOARD ---
            renderDashboard(container) {
                const calc = this.getYearCalculations(this.selectedYear);

                container.innerHTML = `
                    <div class="space-y-4 animate-fade pb-6">
                        <!-- Master Year Selector Card -->
                        <div class="glass-card rounded-2xl p-4 space-y-2 border border-goldborder shadow-md">
                            <label class="block text-[11px] font-semibold text-gold uppercase tracking-wider">Master Active Year Controller</label>
                            <div class="flex items-center space-x-2">
                                <select id="master-year-select" onchange="app.changeMasterYear(this.value)"
                                    class="flex-1 bg-obsidian border border-goldborder rounded-xl px-3 py-2 text-sm text-white font-bold focus:outline-none focus:border-gold">
                                    ${this.availableYears.map(y => `<option value="${y}" ${y === this.selectedYear ? 'selected' : ''}>Tax Year ${y} ${y === this.selectedYear ? '(Selected)' : ''}</option>`).join('')}
                                </select>
                                <button onclick="app.promptAddNewYear()" title="Add New Year" class="px-3 py-2 rounded-xl gold-gradient-btn text-obsidian font-bold text-sm shadow hover:opacity-95 transition">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Selected Year Summary Card -->
                        <div class="glass-card rounded-2xl p-5 space-y-4 border border-gold/40 shadow-xl bg-gradient-to-b from-darkcard to-obsidian">
                            <div class="flex items-center justify-between border-b border-goldborder pb-2">
                                <h2 class="text-xs font-bold text-gold uppercase tracking-wider">Selected Year Summary (${this.selectedYear})</h2>
                                <span class="text-xs text-gray-400">${calc.count} Settlements</span>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-obsidian/60 p-3 rounded-xl border border-goldborder/50">
                                    <span class="block text-[10px] text-gray-400 uppercase">Gross Revenue</span>
                                    <span class="text-base font-bold text-amber-300">${this.formatCurrency(calc.totalGross)}</span>
                                </div>
                                <div class="bg-obsidian/60 p-3 rounded-xl border border-goldborder/50">
                                    <span class="block text-[10px] text-gray-400 uppercase">Total Deductions</span>
                                    <span class="text-base font-bold text-rose-400">-${this.formatCurrency(calc.totalDeductions)}</span>
                                </div>
                            </div>

                            <div class="bg-obsidian/80 p-3 rounded-xl border border-gold flex items-center justify-between shadow-inner">
                                <div>
                                    <span class="block text-[10px] text-gold uppercase font-semibold">Net Payout</span>
                                    <span class="text-lg font-extrabold text-emerald-400">${this.formatCurrency(calc.netPayout)}</span>
                                </div>
                                <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                                    <i class="fa-solid fa-arrow-trend-up"></i>
                                </div>
                            </div>
                        </div>

                        <!-- 2x2 Grid Menu Navigation -->
                        <div class="grid grid-cols-2 gap-3 pt-1">
                            <button onclick="app.navigate('settlement_entry')" class="glass-card p-5 rounded-2xl flex flex-col items-center justify-center space-y-2 hover:border-gold transition group shadow-md text-center">
                                <div class="w-12 h-12 rounded-xl bg-gold/10 text-gold flex items-center justify-center text-xl group-hover:scale-110 transition">
                                    <i class="fa-solid fa-file-invoice-dollar"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-200">Settlement Entry</span>
                            </button>

                            <button onclick="app.navigate('spreadsheets')" class="glass-card p-5 rounded-2xl flex flex-col items-center justify-center space-y-2 hover:border-gold transition group shadow-md text-center">
                                <div class="w-12 h-12 rounded-xl bg-gold/10 text-gold flex items-center justify-center text-xl group-hover:scale-110 transition">
                                    <i class="fa-solid fa-table-list"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-200">Spreadsheets</span>
                            </button>

                            <button onclick="app.navigate('perdiem')" class="glass-card p-5 rounded-2xl flex flex-col items-center justify-center space-y-2 hover:border-gold transition group shadow-md text-center">
                                <div class="w-12 h-12 rounded-xl bg-gold/10 text-gold flex items-center justify-center text-xl group-hover:scale-110 transition">
                                    <i class="fa-solid fa-calendar-days"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-200">Per Diem Log</span>
                            </button>

                            <button onclick="app.navigate('taxform')" class="glass-card p-5 rounded-2xl flex flex-col items-center justify-center space-y-2 hover:border-gold transition group shadow-md text-center">
                                <div class="w-12 h-12 rounded-xl bg-gold/10 text-gold flex items-center justify-center text-xl group-hover:scale-110 transition">
                                    <i class="fa-solid fa-file-shield"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-200">Tax Form</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            changeMasterYear(year) {
                this.selectedYear = year;
                this.saveState();
                this.render();
            }

            promptAddNewYear() {
                const newY = prompt("Enter new tax year (e.g., 2027):");
                if (newY && /^\d{4}$/.test(newY.trim())) {
                    const yr = newY.trim();
                    if (!this.availableYears.includes(yr)) {
                        this.availableYears.push(yr);
                        this.availableYears.sort((a, b) => b.localeCompare(a));
                    }
                    this.selectedYear = yr;
                    this.saveState();
                    this.render();
                } else if (newY) {
                    this.showModal('Invalid Year', 'Please enter a valid 4-digit year format.');
                }
            }

            // --- 3. SETTLEMENT ENTRY SCREEN ---
            renderSettlementEntry(container) {
                const isEditing = this.editingSettlementId !== null;
                let editData = { date: new Date().toISOString().split('T')[0], settlementNum: 'SET-', gross: '', deductions: new Array(12).fill('') };
                
                if (isEditing) {
                    const found = this.settlements.find(s => s.id === this.editingSettlementId);
                    if (found) editData = found;
                }

                container.innerHTML = `
                    <div class="space-y-4 animate-fade pb-6">
                        <div class="flex items-center justify-between border-b border-goldborder pb-2">
                            <h2 class="text-sm font-bold text-gold uppercase tracking-wider">${isEditing ? 'Edit Settlement' : 'New Settlement Entry'} (${this.selectedYear})</h2>
                            ${isEditing ? `<button onclick="app.cancelEditSettlement()" class="text-xs text-rose-400 hover:underline">Cancel Edit</button>` : ''}
                        </div>

                        <form onsubmit="app.saveSettlement(event)" class="glass-card rounded-2xl p-4 space-y-4 shadow-xl border border-goldborder">
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Settlement Date</label>
                                <input type="date" id="set-date" required value="${editData.date}"
                                    class="w-full bg-obsidian border border-goldborder rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-gold">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Settlement Number</label>
                                <input type="text" id="set-num" required placeholder="SET-10100" value="${editData.settlementNum}"
                                    class="w-full bg-obsidian border border-goldborder rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-gold">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-amber-300 mb-1">Gross Revenue ($)</label>
                                <input type="number" step="0.01" id="set-gross" required placeholder="0.00" value="${editData.gross !== '' ? editData.gross : ''}" oninput="app.calculateSettlementForm()"
                                    class="w-full bg-obsidian border border-gold rounded-xl px-3 py-2.5 text-sm text-amber-300 font-bold focus:outline-none">
                            </div>

                            <div class="border-t border-goldborder pt-3">
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="text-xs font-bold text-gold uppercase tracking-wider">12 Customizable Deductions</h3>
                                    <span class="text-[10px] text-gray-400">Click title to rename</span>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    ${this.deductionLabels.map((label, idx) => `
                                        <div class="bg-obsidian/60 p-2 rounded-xl border border-goldborder/60 space-y-1">
                                            <div class="flex items-center justify-between">
                                                <input type="text" value="${label}" onchange="app.renameDeduction(${idx}, this.value)"
                                                    class="text-[11px] font-semibold text-gray-300 bg-transparent border-b border-transparent hover:border-gold focus:border-gold focus:outline-none w-full">
                                            </div>
                                            <input type="number" step="0.01" placeholder="0.00" value="${editData.deductions[idx] || ''}" oninput="app.calculateSettlementForm()"
                                                class="set-deduction-input w-full bg-obsidian border border-goldborder rounded-lg px-2 py-1.5 text-xs text-rose-300 focus:outline-none focus:border-gold" data-index="${idx}">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="bg-obsidian p-3 rounded-xl border border-gold flex items-center justify-between shadow-inner">
                                <span class="text-xs font-bold text-gold uppercase">Calculated Net Payout</span>
                                <span id="set-net-preview" class="text-base font-extrabold text-emerald-400">$0.00</span>
                            </div>

                            <button type="submit" class="w-full py-3 rounded-xl gold-gradient-btn text-obsidian font-bold text-sm shadow-lg transition transform active:scale-95">

                    this.saveState();

            calculateSettlementForm() {
                const gross = parseFloat(document.getElementById('set-gross').value) || 0;
                let totalDed = 0;
                document.querySelectorAll('.set-deduction-input').forEach(input => {
                    totalDed += parseFloat(input.value) || 0;
                });
                const net = gross - totalDed;
                const netEl = document.getElementById('set-net-preview');
                if (netEl) {
                    netEl.innerText = this.formatCurrency(net);
                }
            }

            saveSettlement(e) {
                e.preventDefault();
                const date = document.getElementById('set-date').value;
                const settlementNum = document.getElementById('set-num').value.trim();
                const gross = parseFloat(document.getElementById('set-gross').value) || 0;
                
                let deductions = [];
                document.querySelectorAll('.set-deduction-input').forEach(input => {
                    deductions.push(parseFloat(input.value) || 0);
                });

                if (this.editingSettlementId !== null) {
                    const idx = this.settlements.findIndex(s => s.id === this.editingSettlementId);
                    if (idx !== -1) {
                        this.settlements[idx] = {
                            ...this.settlements[idx],
                            date, settlementNum, gross, deductions, year: this.selectedYear
                        };

                    this.editingSettlementId = null;
                } else {
                    const newEntry = {
                        id: 'set_' + Date.now(),
                        year: this.selectedYear,
                        date, settlementNum, gross, deductions
                    };
                    this.settlements.push(newEntry);
                }

                // Sort chronologically earliest to latest
                this.settlements.sort((a, b) => new Date(a.date) - new Date(b.date));
                this.saveState();
                this.showModal('Success', 'Settlement entry successfully saved and synchronized!', 'fa-circle-check');

                        <!-- Included Spreadsheets Notification -->
                        <div class="glass-card rounded-2xl p-4 space-y-2 border border-goldborder bg-gold/5">
                            <div class="flex items-center space-x-2 text-gold">
                                <i class="fa-solid fa-circle-check"></i>
                                <h4 class="text-xs font-bold uppercase">Included in Annual Tax Packet PDF</h4>
                            </div>
                            <ul class="text-[11px] text-gray-300 space-y-1 pl-5 list-disc">
                                <li>Complete Settlement Spreadsheet (${yearSettlements.length} entries, chronological)</li>
                                <li>Pure Per Diem Log Spreadsheet (${yearPerDiems.length} logged days)</li>
                                <li>Itemized Category Breakdown Summaries</li>
                            </ul>
                        </div>

                        <button onclick="app.printTaxPacket()" class="w-full py-3 rounded-xl gold-gradient-btn text-obsidian font-bold text-sm shadow-lg transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-cloud-arrow-down"></i>
                            <span>DOWNLOAD FULL TAX PACKET (PDF)</span>
                        </button>
                    </div>
                `;
            }

            printTaxPacket() {
                const calc = this.getYearCalculations(this.selectedYear);
                const yearSettlements = this.settlements.filter(s => s.year === this.selectedYear);
                const yearPerDiems = this.perDiems.filter(p => p.year === this.selectedYear);

                yearSettlements.sort((a, b) => new Date(a.date) - new Date(b.date));
                yearPerDiems.sort((a, b) => new Date(a.date) - new Date(b.date));

                let html = `
                    <div style="font-family: sans-serif; padding: 10px;">
                        <h1 style="font-size: 20px; font-weight: bold; border-bottom: 2px solid #D4AF37; padding-bottom: 6px; margin-bottom: 10px;">RigTracker Pro - Annual Tax Packet (${this.selectedYear})</h1>
                        <p style="font-size: 11px; margin-bottom: 15px;"><b>Operator:</b> ${this.currentUser?.email || 'Owner-Operator'} | <b>Generated:</b> ${new Date().toLocaleDateString()}</p>
                        
                        <h2 style="font-size: 14px; font-weight: bold; background: #f4f4f4; padding: 6px; margin-top: 15px;">1. Year-End Financial Totals</h2>
                        <table border="1" cellpadding="6" cellspacing="0" style="width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 15px;">
                            <tr><td><b>Gross Revenue</b></td><td align="right">$${calc.totalGross.toFixed(2)}</td></tr>
                            <tr><td><b>Total Deductions</b></td><td align="right">-$${calc.totalDeductions.toFixed(2)}</td></tr>
                            <tr style="background: #e9f8f0;"><td><b>Net Payout</b></td><td align="right"><b>$${calc.netPayout.toFixed(2)}</b></td></tr>
                        </table>

                        <h2 style="font-size: 14px; font-weight: bold; background: #f4f4f4; padding: 6px; margin-top: 15px;">2. Itemized Deduction Breakdowns</h2>
                        <table border="1" cellpadding="6" cellspacing="0" style="width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 15px;">
                            ${this.deductionLabels.map((l, idx) => `
                                <tr><td>${l}</td><td align="right">$${calc.itemizedTotals[idx].toFixed(2)}</td></tr>
                            `).join('')}
                        </table>

                        <h2 style="font-size: 14px; font-weight: bold; background: #f4f4f4; padding: 6px; margin-top: 15px;">3. Complete Settlement Spreadsheet (${yearSettlements.length} Entries)</h2>
                        <table border="1" cellpadding="5" cellspacing="0" style="width: 100%; border-collapse: collapse; font-size: 9px; margin-bottom: 15px;">
                            <tr style="background: #eaeaea;">
                                <th>Date</th><th>Settlement #</th><th>Gross</th>
                                ${this.deductionLabels.map(l => `<th>${l}</th>`).join('')}
                                <th>Net Payout</th>
                            </tr>
                            ${yearSettlements.map(s => {
                                let rDed = s.deductions.reduce((a, b) => a + Number(b || 0), 0);
                                let net = s.gross - rDed;
                                return `
                                    <tr>
                                        <td>${s.date}</td><td><b>${s.settlementNum}</b></td>
                                        <td align="right">$${Number(s.gross).toFixed(2)}</td>
                                        ${s.deductions.map(d => `<td align="right">${d ? '$' + Number(d).toFixed(2) : '-'}</td>`).join('')}
                                        <td align="right"><b>$${net.toFixed(2)}</b></td>
                                    </tr>
                                `;
                            }).join('')}
                        </table>

                        <h2 style="font-size: 14px; font-weight: bold; background: #f4f4f4; padding: 6px; margin-top: 15px;">4. Per Diem Log Spreadsheet (${yearPerDiems.length} Logged Days)</h2>
                        <table border="1" cellpadding="5" cellspacing="0" style="width: 100%; border-collapse: collapse; font-size: 9px;">
                            <tr style="background: #eaeaea;">
                                <th>Date</th><th>Location</th><th>Area Description</th><th>Pro / Load #</th><th>Time</th><th>TZ</th>
                            </tr>
                            ${yearPerDiems.map(p => `
                                <tr>
                                    <td>${p.date}</td><td><b>${p.location}</b></td>
                                    <td>${p.area || '-'}</td><td>${p.loadNum || '-'}</td><td>${p.time}</td><td>${p.tz}</td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                `;

                document.getElementById('print-modal-title').innerText = `RigTracker Pro Tax Packet (${this.selectedYear})`;
                document.getElementById('print-modal-content').innerHTML = html;
                document.getElementById('print-modal').classList.remove('hidden');
            }
        }

        // Initialize App on window load
        let app;
        window.onload = function() {
            app = new RigTrackerApp();
        };
    </script>
</body>
</html>
